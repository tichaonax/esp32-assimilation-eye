; Assimilation Eye — PlatformIO project configuration
;
; Build and upload:   pio run -t upload
; Serial console:     pio device monitor
; Unit tests (PC):    pio test -e native
; Unit tests (board): pio test -e esp32dev
;
; Run pio from PowerShell or cmd, not Git Bash: the ESP-IDF tool installer the
; platform uses refuses to run under MSYS/MinGW shells.
;
; No upload_port / monitor_port is set on purpose: PlatformIO finds the board
; by its CP210x USB id, so the project keeps working when the COM port changes.
; If two CP210x devices are attached, pass --upload-port COMx for that run.

[platformio]
default_envs = esp32dev
; This project keeps its platform, toolchains and build tools in its own
; PlatformIO core folder. The pinned platform installs the "pioarduino" core
; package into whichever core folder it runs from; sharing the default
; ~/.platformio would replace the official PlatformIO there and change how
; other projects on this PC build.
core_dir = ${sysenv.USERPROFILE}/.pio-assimilation-eye

[env]
test_framework = unity

; DOIT ESP32 DEVKIT V1 (30-pin) and ESP32-DevKitC (38-pin). Same module, same build.
[env:esp32dev]
; pioarduino 55.03.312-1 = Arduino core 3.3.12 on ESP-IDF 5.5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
; Two firmware slots of about 1.9 MB each, for over-the-air updates
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -D FIRMWARE_VERSION=\"0.3.0\"
  ; Bring-up probe: the BOOT button, or the letter n on the serial console,
  ; steps through demonstration settings. Removed in Phase 7.
  -D BRINGUP_PROBE=1

; Runs the hardware-independent tests on the PC. Needs g++ on PATH.
[env:native]
platform = native
build_flags = -std=gnu++17
